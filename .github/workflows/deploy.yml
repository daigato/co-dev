name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Key
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "js/config.js";
            let content = fs.readFileSync(file, "utf8");
            content = content.replace("REPLACE_ORS_API_KEY", process.env.ORS_API_KEY || "");
            fs.writeFileSync(file, content);
          '

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: co-dev
          directory: .
          gitCommitHash: ${{ github.sha }}
