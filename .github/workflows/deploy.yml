name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Key
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const key = process.env.ORS_API_KEY ? process.env.ORS_API_KEY.trim() : "";
            if (!key) {
              console.error("❌ ERROR: secrets.ORS_API_KEY is empty or not found in GitHub Secrets!");
              process.exit(1);
            }
            const file = "js/config.js";
            let content = fs.readFileSync(file, "utf8");
            content = content.replace("REPLACE_ORS_API_KEY", key);
            fs.writeFileSync(file, content);
            console.log("✅ Successfully injected ORS_API_KEY into js/config.js (length: " + key.length + ")");
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
